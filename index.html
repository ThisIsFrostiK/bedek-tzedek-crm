<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="./logobz.png">
<title>Bedek Tzedek CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Rubik:wght@500;600;700;800&display=swap">
<style>
/* Layout: a navy brand bar (the logo's night-sky world) across the top, then a calm working surface:
   pill tabs, rounded cards and lists. Navy = structure and trust, amber = action (the logo's check mark). */
:root{
  --bg:#f2f5fa; --surface:#ffffff; --sunk:#f5f8fc; --ink:#0f1d33; --muted:#5b6a84; --line:#e0e6ef;
  --brand:#1d3a66; --brand-ink:#ffffff; --brand-soft:#e5edfa; --brand-text:#24528f;
  --accent:#f6a623; --accent-ink:#1d1300; --accent-soft:#fff0d4; --accent-text:#9c5f06;
  --good:#1d8550; --good-soft:#dcf2e5; --bad:#bf3434; --bad-soft:#fbe2e2; --neutral-soft:#ecf0f6;
  --bar-bg:#0b1830; --bar-ink:#eef3fb; --bar-muted:#a3b4cd; --bar-line:#25395b; --logo-bg:#04070c;
  --stamp:var(--accent-text); --stamp-soft:var(--accent-soft); --accent-ring:var(--brand-text);
  --shadow:0 1px 2px rgba(15,29,51,.05),0 6px 20px rgba(15,29,51,.07);
  --shadow-lg:0 20px 60px rgba(8,18,36,.28);
  --f-display:"Rubik","Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-body:"Heebo","Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"Rubik","Heebo",system-ui,sans-serif;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09101e; --surface:#101a2d; --sunk:#0c1526; --ink:#e7eef9; --muted:#93a4bf; --line:#1d2a43;
  --brand:#4f84d6; --brand-ink:#04132b; --brand-soft:#16284a; --brand-text:#8fb6f0;
  --accent:#ffb43a; --accent-ink:#1d1300; --accent-soft:#33250c; --accent-text:#ffc565;
  --good:#5ccf93; --good-soft:#103222; --bad:#f08484; --bad-soft:#3a191c; --neutral-soft:#17233a;
  --bar-bg:#060c18; --bar-ink:#eef3fb; --bar-muted:#8fa2c0; --bar-line:#1a2945;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.28); --shadow-lg:0 24px 70px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09101e; --surface:#101a2d; --sunk:#0c1526; --ink:#e7eef9; --muted:#93a4bf; --line:#1d2a43;
  --brand:#4f84d6; --brand-ink:#04132b; --brand-soft:#16284a; --brand-text:#8fb6f0;
  --accent:#ffb43a; --accent-ink:#1d1300; --accent-soft:#33250c; --accent-text:#ffc565;
  --good:#5ccf93; --good-soft:#103222; --bad:#f08484; --bad-soft:#3a191c; --neutral-soft:#17233a;
  --bar-bg:#060c18; --bar-ink:#eef3fb; --bar-muted:#8fa2c0; --bar-line:#1a2945;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.28); --shadow-lg:0 24px 70px rgba(0,0,0,.6);
  color-scheme:dark}
:root[lang="he"]{--f-body:"Heebo","Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}

/* ---- brand bar ---- */
.topbar{background:var(--bar-bg);color:var(--bar-ink);background-image:radial-gradient(120% 140% at 85% -40%,rgba(79,132,214,.28),transparent 60%),radial-gradient(60% 120% at 10% 130%,rgba(246,166,35,.14),transparent 60%)}
.topbar-in{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand .mark{width:78px;height:auto;border-radius:12px;background:var(--logo-bg);box-shadow:0 0 0 1px var(--bar-line);display:block;flex:none}
.brand .wm{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand .name{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.05;letter-spacing:.2px;white-space:nowrap}
.brand .name .w1{color:#f3f6fb}
.brand .name .w2{color:#ffb43a}
.brand .name small{font-weight:600;font-size:14px;color:var(--bar-muted);margin-inline-start:6px;letter-spacing:.06em}
.brand .tag{font-size:13px;color:var(--bar-muted)}
.brand .tag i{font-style:normal;color:#ffb43a;padding-inline:4px}
.hright{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.sync{font-size:13px;color:var(--bar-muted);display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bar-muted)}
.dot.on{background:#5ccf93;box-shadow:0 0 0 3px rgba(92,207,147,.18)} .dot.off{background:#f08484}
#who{gap:8px}
.topbar .btn{background:transparent;color:var(--bar-ink);border-color:var(--bar-line)}
.topbar .btn:hover{border-color:var(--bar-muted)}
.lang{display:inline-flex;border:1px solid var(--bar-line);border-radius:999px;padding:3px;gap:2px}
.lang button{font-size:13px;font-weight:600;border:0;background:none;color:var(--bar-muted);padding:5px 12px;cursor:pointer;border-radius:999px}
.lang button[aria-pressed="true"]{background:#ffb43a;color:#1d1300}
.iconbtn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:999px;border:1px solid var(--bar-line);background:transparent;color:var(--bar-ink);cursor:pointer}
.iconbtn:hover{border-color:var(--bar-muted)}
.iconbtn svg{width:17px;height:17px}

/* ---- page ---- */
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 64px;display:flex;flex-direction:column;gap:20px}
nav{display:flex;flex-wrap:wrap;gap:4px;padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);align-self:flex-start;max-width:100%}
nav:empty{display:none}
nav button{font-family:var(--f-display);font-size:15px;font-weight:500;background:none;border:0;color:var(--muted);padding:8px 16px;border-radius:13px;cursor:pointer;display:flex;gap:8px;align-items:center;transition:background .15s,color .15s}
nav button:hover{color:var(--ink);background:var(--sunk)}
nav button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
nav .n{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);background:var(--neutral-soft);min-width:22px;text-align:center;padding:1px 7px;border-radius:999px}
nav button[aria-selected="true"] .n{background:rgba(255,255,255,.2);color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible{outline:2px solid var(--accent-ring);outline-offset:2px}
.panel-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.panel-head h2{font-family:var(--f-display);font-size:28px;margin:0;font-weight:700;text-wrap:balance}
.explain{margin:4px 0 0;color:var(--muted);max-width:66ch;font-size:14px}
.btn{font-weight:600;font-size:14px;border-radius:999px;padding:9px 18px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;transition:transform .1s,filter .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 4px 14px rgba(246,166,35,.28)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)} .btn.danger.armed{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn.small{padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input[type=search],.toolbar select{font-size:14px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);min-width:0}
.toolbar input[type=search]{flex:1 1 220px}
.toolbar label{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.toolbar input[type=checkbox]{accent-color:var(--brand)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:14px 18px;border-top:1px solid var(--line);cursor:pointer;align-items:center;transition:background .12s}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row .main{min-width:0;display:flex;flex-direction:column;gap:3px}
.row .title{font-family:var(--f-display);font-weight:600;font-size:15.5px;overflow-wrap:anywhere}
.row .meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.row .side{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.task{grid-template-columns:auto minmax(0,1fr) auto}
.task input[type=checkbox]{width:20px;height:20px;accent-color:var(--good);cursor:pointer}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--neutral-soft);color:var(--ink);white-space:nowrap}
.pill.accent{background:var(--brand-soft);color:var(--brand-text)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.stamp{background:var(--accent-soft);color:var(--accent-text)}
.ex{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--accent-text);border:1px dashed var(--accent-text);padding:0 7px;border-radius:999px;vertical-align:middle}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.overdue{color:var(--bad);font-weight:600}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);margin-bottom:4px;font-family:var(--f-display);font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.kpi .lab{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
:root[lang="he"] .kpi .lab{font-size:13.5px;letter-spacing:0}
.kpi .val{font-family:var(--f-display);font-size:32px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--ink)}
.kpi .sub{font-size:13px;color:var(--muted)}
.kpis .kpi:first-child{background:var(--brand);border-color:var(--brand)}
.kpis .kpi:first-child .lab,.kpis .kpi:first-child .sub{color:var(--brand-ink);opacity:.8}
.kpis .kpi:first-child .val{color:var(--brand-ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.card h3{margin:0;font-family:var(--f-display);font-size:17px;font-weight:600}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:160px minmax(0,1fr) 32px;gap:12px;align-items:center;font-size:14px}
.bar .track{height:12px;background:var(--neutral-soft);border-radius:999px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--brand);border-radius:999px;min-width:0}
.bar .num{text-align:end;font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums}
.section-title{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.section-title h3{font-family:var(--f-display);font-size:22px;font-weight:700;margin:0}
.section-title select{border-radius:999px!important}
.welcome ol{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:8px}
.welcome li::marker{color:var(--accent-text);font-weight:700;font-family:var(--f-display)}
.banner{padding:12px 16px;border-radius:var(--r-sm);background:var(--bad-soft);color:var(--bad);font-size:14px}

/* ---- login ---- */
.login{max-width:440px;margin:24px auto;width:100%}
.login-wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:center;max-width:940px;width:100%;margin:12px auto}
.login-wrap .login{margin:0;max-width:none;padding:26px}
.login-logo{background:var(--logo-bg);border-radius:22px;overflow:hidden;box-shadow:var(--shadow-lg)}
.login-logo img{display:block;width:100%;height:auto}
.login .btn.primary{width:100%;padding-block:11px;font-size:15px}
@media (max-width:760px){.login-wrap{grid-template-columns:1fr}}

/* ---- form sheet ---- */
.overlay{position:fixed;inset:0;background:rgba(6,12,24,.5);backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:flex-start;padding:28px 16px;overflow-y:auto;z-index:20}
.sheet{background:var(--surface);color:var(--ink);border-radius:20px;width:100%;max-width:600px;padding:24px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line);box-shadow:var(--shadow-lg)}
.sheet h2{margin:0;font-family:var(--f-display);font-size:24px;font-weight:700}
.sheet .hint{margin:-10px 0 0;font-size:13.5px;color:var(--muted)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:13px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--sunk);color:var(--ink);width:100%;transition:border-color .15s,background .15s}
.fld input:hover,.fld select:hover,.fld textarea:hover{border-color:var(--muted)}
.fld input:focus,.fld select:focus,.fld textarea:focus{background:var(--surface);border-color:var(--brand-text)}
.fld input:disabled,.fld select:disabled,.fld textarea:disabled{opacity:.7;cursor:not-allowed}
.fld input[type=tel],.fld input[type=email],.fld input[type=number],.fld input[type=date],.fld input[type=password]{direction:ltr;text-align:start}
:root[dir="rtl"] .fld input[type=tel],:root[dir="rtl"] .fld input[type=email],:root[dir="rtl"] .fld input[type=number],:root[dir="rtl"] .fld input[type=date],:root[dir="rtl"] .fld input[type=password]{text-align:right}
.fld textarea{min-height:84px;resize:vertical}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.actions .end{display:flex;gap:8px;margin-inline-start:auto}
.related{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.related h4{margin:0;font-family:var(--f-display);font-size:15px;font-weight:600}
.related .list{box-shadow:none}
.related .list .row{padding:9px 14px}
.err{color:var(--bad);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--bar-bg);color:var(--bar-ink);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;z-index:30;max-width:calc(100% - 32px);box-shadow:var(--shadow-lg)}
@media (max-width:620px){
  .fields{grid-template-columns:1fr}
  .bar{grid-template-columns:120px minmax(0,1fr) 28px}
  .brand .name{font-size:23px}.brand .mark{width:62px}.brand .tag{display:none}
  .panel-head h2{font-size:24px}
  nav{border-radius:14px}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(10px);opacity:.5}}}
html,body{margin:0}
@media (max-width:620px){.kpis{grid-template-columns:1fr 1fr;gap:10px}.kpis .kpi:first-child{grid-column:1/-1}.kpi{padding:14px}.kpi .val{font-size:26px}}
</style>
</head>

 clients:[{k:'name',l:'f_name',req:1},{k:'phone',l:'f_phone',t:'tel'},{k:'email',l:'f_email',t:'email'},{k:'ownerId',l:'f_ownerClient',t:'member'},{k:'notes',l:'f_notes',t:'textarea'}],
 cases:[{k:'title',l:'f_title',req:1,full:1},{k:'clientId',l:'f_client',t:'client',req:1},{k:'claimType',l:'f_claimType',t:'select',o:CLAIM_TYPES},{k:'amount',l:'f_amount',t:'number'},{k:'stage',l:'f_stage',t:'select',o:STAGES},{k:'hearingDate',l:'f_hearing',t:'date'},{k:'ownerId',l:'f_ownerCase',t:'member'},{k:'notes',l:'f_notes',t:'textarea'}],
 tasks:[{k:'title',l:'f_taskTitle',req:1,full:1},{k:'dueDate',l:'f_due',t:'date'},{k:'ownerId',l:'f_ownerTask',t:'member'},{k:'caseId',l:'f_caseRel',t:'case'},{k:'clientId',l:'f_clientRel',t:'client'},{k:'notes',l:'f_notes',t:'textarea'}]
};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const fmtDate=s=>{if(!s)return '';const [y,m,d]=s.slice(0,10).split('-');return `<bdi class="mono" dir="ltr">${d}/${m}/${y}</bdi>`};
const money=n=>{try{return (Math.round(Number(n)||0)).toLocaleString(lang==='he'?'he-IL':'en-IL',{style:'currency',currency:'ILS',maximumFractionDigits:0})}catch(e){return '₪'+Math.round(Number(n)||0)}};
const caseNo=id=>`<bdi class="mono" dir="ltr">#${esc(String(id).slice(-5).toUpperCase())}</bdi>`;
const caseNoTxt=id=>'#'+String(id).slice(-5).toUpperCase();
const ltr=s=>`<bdi class="mono" dir="ltr">${esc(s)}</bdi>`;

let db=null,conn='connecting';
const data={team:[],leads:[],clients:[],cases:[],tasks:[]};
const loaded={};
let tab=(()=>{const h=location.hash.slice(1);return TABS.includes(h)?h:(TABS.includes(LS.get('crm.tab'))?LS.get('crm.tab'):'dash')})();
const filt={q:'',owner:'',closed:false,done:false};
let me=LS.get('crm.me')||'';
let sheetState=null;

const byId=(col,id)=>data[col].find(r=>r.id===id);
const memberName=id=>{const m=byId('team',id);return m?m.name:t('unassigned')};
const clientName=id=>{const c=byId('clients',id);return c?c.name:''};
/* who is signed in, and what may they do (the database enforces the same rules) */
const myRow=()=>{const e=(typeof session!=='undefined'&&session&&session.user&&(session.user.email||'').toLowerCase())||'';return e?data.team.find(m=>m.email&&m.email.toLowerCase()===e)||null:null};
const myId=()=>{const r=myRow();return r?r.id:null};
const isAdmin=()=>{const r=myRow();return !!(r&&r.isAdmin)};
function canEdit(col,rec){if(isAdmin())return true;if(col==='team'||!myId())return false;return !rec||rec.ownerId===myId()}
function canClaim(col,rec){return col==='leads'&&!!rec&&!rec.ownerId&&!isAdmin()&&!!myId()}
function canDelete(col,rec){if(col==='team'&&rec&&rec.id===myId())return false;return isAdmin()||(col==='tasks'&&!!rec&&rec.ownerId===myId())}

function toast(msg){const el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2800)}

/* ---------- chrome (header, language) ---------- */
function applyLang(){
  const root=document.documentElement;root.lang=lang;root.dir=lang==='he'?'rtl':'ltr';
  $('#brand').innerHTML=`<img class="mark" src="${LOGO_MARK}" alt="" width="78" height="49"><div class="wm">`+
    (lang==='he'?`<div class="name"><span class="w1">בדק</span> <span class="w2">צדק</span></div>`
                :`<div class="name"><span class="w1">Bedek</span> <span class="w2">Tzedek</span><small>CRM</small></div>`)+
    `<div class="tag">${t('tagline')}</div></div>`;
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));

/* light / dark switch: remembered per device; until someone picks, it follows the computer's setting */
let theme=LS.get('crm.theme');if(theme!=='light'&&theme!=='dark')theme=null;
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/></svg>';
const sysDark=()=>{try{return matchMedia('(prefers-color-scheme: dark)').matches}catch(e){return false}};
const isDark=()=>theme?theme==='dark':sysDark();
function applyTheme(){
  const root=document.documentElement;
  if(theme)root.setAttribute('data-theme',theme);else root.removeAttribute('data-theme');
  const b=$('#themeBtn');if(!b)return;
  b.innerHTML=isDark()?SUN:MOON;const lbl=isDark()?t('toLight'):t('toDark');b.title=lbl;b.setAttribute('aria-label',lbl);
}
$('#themeBtn').addEventListener('click',()=>{theme=isDark()?'light':'dark';LS.set('crm.theme',theme);applyTheme()});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!theme)applyTheme()})}catch(e){}
function renderSync(){
  $('#dot').className='dot '+(conn==='on'?'on':['off','lost','config'].includes(conn)?'off':'');
  $('#syncText').textContent=conn==='on'?t('live'):conn==='off'?t('notConnected'):conn==='lost'?t('connLost'):conn==='config'?t('notConfigured'):conn==='out'?t('signedOut'):t('connecting');
  const b=$('#banner');
  if(conn==='off'){b.textContent=t('bannerNoDb');b.hidden=false}else if(conn==='lost'){b.textContent=t('bannerLost');b.hidden=false}else b.hidden=true;
  const who=$('#who');
  if(session&&session.user){who.innerHTML=`<bdi dir="ltr">${esc(session.user.email||'')}</bdi><button type="button" class="btn small" id="signOut">${t('signOut')}</button>`;$('#signOut').onclick=()=>{closeSheet();sb.auth.signOut()}}
  else who.innerHTML='';
}
document.querySelector('.lang').addEventListener('click',e=>{
  const b=e.target.closest('button[data-lang]');if(!b||b.dataset.lang===lang)return;
  lang=b.dataset.lang;LS.set('crm.lang',lang);applyLang();render();
  if(sheetState)openForm(sheetState.col,sheetState.rec&&byId(sheetState.col,sheetState.rec.id),sheetState.defaults,true);
});

/* ---------- tabs ---------- */
function renderTabs(){
  const counts={leads:data.leads.filter(l=>!['converted','lost'].includes(l.status)).length,clients:data.clients.length,cases:data.cases.filter(c=>!CLOSED.includes(c.stage)).length,tasks:data.tasks.filter(x=>!x.done).length,team:data.team.length};
  $('#tabs').innerHTML=TABS.map(k=>`<button role="tab" data-tab="${k}" aria-selected="${tab===k}">${t('tab_'+k)}${counts[k]!=null?` <span class="n">${counts[k]}</span>`:''}</button>`).join('');
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;tab=b.dataset.tab;LS.set('crm.tab',tab);filt.q='';filt.owner='';render()});

/* ---------- main render ---------- */
function render(){
  const v=$('#view');
  if(conn==='config'||conn==='out'||conn==='connecting'){
    $('#tabs').innerHTML='';
    const logo=`<div class="login-logo"><img src="${LOGO_FULL}" alt="בדק צדק" width="760" height="507"></div>`;
    v.innerHTML=conn==='config'?`<div class="login-wrap">${logo}<div class="card login"><h3 style="font-family:var(--f-display);font-size:22px">${t('configTitle')}</h3><p class="explain">${esc(t('configBody'))}</p></div></div>`
      :conn==='connecting'?`<div class="empty">${t('loading')}</div>`
      :`<div class="login-wrap">${logo}<div class="card login"><h3 style="font-family:var(--f-display);font-size:24px">${t('loginTitle')}</h3><p class="explain">${t('loginExplain')}</p>
        <form id="loginForm" class="fields" style="grid-template-columns:1fr" novalidate>
         <div class="fld"><label for="lgEmail">${t('f_email')}</label><input id="lgEmail" type="email" autocomplete="username" required></div>
         <div class="fld"><label for="lgPass">${t('password')}</label><input id="lgPass" type="password" autocomplete="current-password" required></div>
         <div class="err" id="lgErr" hidden></div>
         <div><button class="btn primary" type="submit" id="lgBtn">${t('signIn')}</button></div>
        </form></div></div>`;
    return;
  }
  renderTabs();
  const focusId=document.activeElement&&document.activeElement.id;
  v.innerHTML=tab==='dash'?renderDash():renderListTab(tab);
  if(focusId==='q'){const q=$('#q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
}

function ownerOptions(sel,blank){return `<option value="">${esc(blank)}</option>`+data.team.map(m=>`<option value="${esc(m.id)}"${m.id===sel?' selected':''}>${esc(m.name)}</option>`).join('')}

function renderListTab(col){
  const isTeam=col==='team';
  let rows=data[col].slice();
  const q=filt.q.trim().toLowerCase();
  if(q)rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q)||(r.clientId&&clientName(r.clientId).toLowerCase().includes(q)));
  if(filt.owner&&!isTeam)rows=rows.filter(r=>r.ownerId===filt.owner);
  if(col==='cases'&&!filt.closed)rows=rows.filter(r=>!CLOSED.includes(r.stage));
  if(col==='leads'&&!filt.closed)rows=rows.filter(r=>!['converted','lost'].includes(r.status));
  if(col==='tasks'&&!filt.done)rows=rows.filter(r=>!r.done);
  if(col==='tasks')rows.sort((a,b)=>(a.done-b.done)||((a.dueDate||'9999').localeCompare(b.dueDate||'9999')));
  else rows.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  const toggle=col==='cases'?`<label><input type="checkbox" id="tglClosed"${filt.closed?' checked':''}> ${t('showClosedCases')}</label>`
    :col==='leads'?`<label><input type="checkbox" id="tglClosed"${filt.closed?' checked':''}> ${esc(t('showClosedLeads'))}</label>`
    :col==='tasks'?`<label><input type="checkbox" id="tglDone"${filt.done?' checked':''}> ${t('showDone')}</label>`:'';
  const total=data[col].length;
  const body=!loaded[col]?`<div class="empty">${t('loading')}</div>`
   :rows.length?rows.map(r=>rowHTML(col,r)).join('')
   :total?`<div class="empty"><strong>${t('noMatch')}</strong>${t('tryClear')}</div>`
   :`<div class="empty"><strong>${t('empty_'+col)}</strong>${col!=='team'&&!data.team.length?t('tipTeam')+'<br>':''}${esc(t('pressNew',t('new_'+col)))}</div>`;
  return `<section style="display:flex;flex-direction:column;gap:14px">
   <div class="panel-head"><div><h2>${t('tab_'+col)}</h2><p class="explain">${esc(t('exp_'+col))}</p></div>
   ${(isAdmin()||(col!=='team'&&myId()))?`<button class="btn primary" data-new="${col}"${db?'':' disabled'}>${t('new_'+col)}</button>`:''}</div>
   <div class="toolbar"><input type="search" id="q" placeholder="${esc(t('search_'+col))}" value="${esc(filt.q)}" aria-label="${esc(t('search_'+col))}">
   ${isTeam||!isAdmin()?'':`<select id="ownerF" aria-label="${esc(t('everyone'))}">${ownerOptions(filt.owner,t('everyone'))}</select>`}${toggle}</div>
   <div class="list">${body}</div></section>`;
}

function rowHTML(col,r){
  const ex=r.example?` <span class="ex">${t('exampleTag')}</span>`:'';
  if(col==='team'){
    const open=data.cases.filter(c=>c.ownerId===r.id&&!CLOSED.includes(c.stage)).length;
    const tasks=data.tasks.filter(x=>x.ownerId===r.id&&!x.done).length;
    return `<div class="row" tabindex="0" data-open="team" data-id="${esc(r.id)}"><div class="main"><span class="title" dir="auto">${esc(r.name)}${ex}</span><span class="meta"><span dir="auto">${esc(r.role||'')}</span>${r.email?`<bdi dir="ltr">${esc(r.email)}</bdi>`:''}</span></div><div class="side">${r.isAdmin?`<span class="pill accent">${t('adminPill')}</span>`:''}${r.email?'':`<span class="pill stamp">${t('noLoginPill')}</span>`}<span class="pill">${t('openCasesN',open)}</span><span class="pill">${t('openTasksN',tasks)}</span></div></div>`;
  }
  if(col==='leads'){
    const cls={new:'stamp',contacted:'accent',qualified:'accent',lost:'bad',converted:'good'}[r.status]||'';
    return `<div class="row" tabindex="0" data-open="leads" data-id="${esc(r.id)}"><div class="main"><span class="title" dir="auto">${esc(r.name)}${ex}</span><span class="meta"><span>${label(CLAIM_TYPES,r.claimType)}</span><span>${t('via',label(SOURCES,r.source))}</span><span>${esc(memberName(r.ownerId))}</span>${r.phone?ltr(r.phone):''}</span></div><div class="side">${!r.ownerId?`<span class="pill stamp">${t('pool')}</span>`:''}<span class="pill ${cls}">${label(LEAD_STATUS,r.status||'new')}</span></div></div>`;
  }
  if(col==='clients'){
    const cs=data.cases.filter(c=>c.clientId===r.id);const open=cs.filter(c=>!CLOSED.includes(c.stage)).length;
    return `<div class="row" tabindex="0" data-open="clients" data-id="${esc(r.id)}"><div class="main"><span class="title" dir="auto">${esc(r.name)}${ex}</span><span class="meta">${r.phone?ltr(r.phone):''}${r.email?`<bdi dir="ltr">${esc(r.email)}</bdi>`:''}<span>${esc(memberName(r.ownerId))}</span></span></div><div class="side"><span class="pill">${t('casesN',cs.length,open)}</span></div></div>`;
  }
  if(col==='cases'){
    const cls=r.stage==='won'||r.stage==='settled'?'good':r.stage==='lost'?'bad':r.stage==='hearing'?'stamp':'accent';
    const hear=r.hearingDate&&!CLOSED.includes(r.stage)?`<span>${t('hearing',fmtDate(r.hearingDate))}</span>`:'';
    return `<div class="row" tabindex="0" data-open="cases" data-id="${esc(r.id)}"><div class="main"><span class="title"><span style="color:var(--muted);font-weight:400">${caseNo(r.id)}</span> <bdi dir="auto">${esc(r.title)}</bdi>${ex}</span><span class="meta"><bdi dir="auto">${esc(clientName(r.clientId)||t('noClient'))}</bdi><span>${label(CLAIM_TYPES,r.claimType)}</span>${r.amount?`<span class="mono">${money(r.amount)}</span>`:''}${hear}<span>${esc(memberName(r.ownerId))}</span></span></div><div class="side"><span class="pill ${cls}">${label(STAGES,r.stage||'new')}</span></div></div>`;
  }
  if(col==='tasks'){
    const od=!r.done&&r.dueDate&&r.dueDate<today();
    const cs=r.caseId&&byId('cases',r.caseId);
    const link=cs?`<span>${t('caseWord')} ${caseNo(r.caseId)} <bdi dir="auto">${esc(cs.title)}</bdi></span>`:r.clientId?`<bdi dir="auto">${esc(clientName(r.clientId))}</bdi>`:'';
    return `<div class="row task${r.done?' done':''}" tabindex="0" data-open="tasks" data-id="${esc(r.id)}"><input type="checkbox" data-done="${esc(r.id)}"${r.done?' checked':''} aria-label="${t('markDone')}"><div class="main"><span class="title" dir="auto">${esc(r.title)}${ex}</span><span class="meta">${link}<span>${esc(memberName(r.ownerId))}</span></span></div><div class="side">${r.dueDate?`<span class="${od?'overdue':''}" style="font-size:13px">${od?t('overdue')+' · ':''}${fmtDate(r.dueDate)}</span>`:''}</div></div>`;
  }
}

/* ---------- dashboard ---------- */
function stats(ownerId){
  const f=r=>!ownerId||r.ownerId===ownerId;
  const leads=data.leads.filter(f),cases=data.cases.filter(f),tasks=data.tasks.filter(f);
  const now=new Date();const ms=new Date(now.getFullYear(),now.getMonth(),1).toISOString();
  const conv=leads.filter(l=>l.status==='converted').length;
  const decided=leads.filter(l=>['converted','lost'].includes(l.status)).length;
  const open=cases.filter(c=>!CLOSED.includes(c.stage));
  const won=cases.filter(c=>c.stage==='won').length,set=cases.filter(c=>c.stage==='settled').length,lost=cases.filter(c=>c.stage==='lost').length;
  const td=today();
  return {leadsMonth:leads.filter(l=>(l.createdAt||'')>=ms).length,leadsTotal:leads.length,conv,decided,
    open:open.length,openAmt:open.reduce((s,c)=>s+(Number(c.amount)||0),0),won,set,lost,closed:won+set+lost,
    tasksOpen:tasks.filter(x=>!x.done).length,overdue:tasks.filter(x=>!x.done&&x.dueDate&&x.dueDate<td).length,
    doneMonth:tasks.filter(x=>x.done&&(x.doneAt||'')>=ms).length,tasks};
}
const pct=(a,b)=>b?`<bdi dir="ltr">${Math.round(a/b*100)}%</bdi>`:'—';
const kpi=(lab,val,sub)=>`<div class="kpi"><span class="lab">${lab}</span><span class="val">${val}</span><span class="sub">${sub}</span></div>`;

function renderDash(){
  if(conn==='off')return `<div class="card"><h3>${t('notConnTitle')}</h3><p class="explain">${t('notConnBody')}</p></div>`;
  if(!COLS.every(c=>loaded[c]))return `<div class="empty">${t('loadingData')}</div>`;
  const mine=myRow(),admin=isAdmin();
  if(!mine)return `<div class="card login"><h3 style="font-family:var(--f-display);font-size:22px">${t('notLinkedTitle')}</h3><p class="explain">${esc(t('notLinkedBody',session&&session.user?session.user.email:''))}</p></div>`;
  const work=['leads','clients','cases','tasks'].every(c=>!data[c].length);
  if(admin&&work&&data.team.length<=1)return `<div class="card welcome"><h3 style="font-family:var(--f-display);font-size:22px">${t('welcomeTitle')}</h3><ol>${t('welcomeSteps')}</ol>
   <p class="explain">${t('welcomeEx')}</p><div><button class="btn primary" id="loadEx">${t('loadEx')}</button></div></div>`;
  if(!admin&&work)return `<div class="card"><h3 style="font-family:var(--f-display);font-size:22px">${t('myPerf')}</h3><p class="explain">${t('memberEmpty')}</p></div>`;
  const anyExample=admin&&COLS.some(c=>data[c].some(r=>r.example));
  const sel=admin?(byId('team',me)?me:mine.id):mine.id;
  const p=stats(sel);
  const td=today(),soon=addDays(7);
  const due=(admin?data.tasks:p.tasks).filter(x=>!x.done&&x.dueDate&&x.dueDate<=soon).sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,8);
  let whole='';
  if(admin){
    const s=stats('');
    const counts=STAGES.filter(st=>!CLOSED.includes(st[0])).map(st=>[label(STAGES,st[0]),data.cases.filter(c=>c.stage===st[0]||(!c.stage&&st[0]==='new')).length]);
    const max=Math.max(1,...counts.map(c=>c[1]));
    whole=`<div class="section-title"><h3>${t('wholeBiz')}</h3></div>
  <div class="kpis">
   ${kpi(t('k_newLeads'),s.leadsMonth,t('k_leadsTotal',s.leadsTotal))}
   ${kpi(t('k_signed'),pct(s.conv,s.decided),t('k_ofDecided',s.conv,s.decided))}
   ${kpi(t('k_open'),s.open,t('k_claimed',money(s.openAmt)))}
   ${kpi(t('k_won'),pct(s.won+s.set,s.closed),t('k_outcomes',s.won,s.set,s.lost))}
   ${kpi(t('k_overdue'),`<span${s.overdue?' class="overdue"':''}>${s.overdue}</span>`,t('k_openTotal',s.tasksOpen))}
  </div>
  <div class="card"><h3>${t('byStage')}</h3><div class="bars">${counts.map(([l,n])=>`<div class="bar"><span>${l}</span><span class="track"><span class="fill" style="width:${n/max*100}%"></span></span><span class="num mono">${n}</span></div>`).join('')}</div></div>`;
  }
  const dueCard=`<div class="card"><h3>${t('dueWeek')}</h3>
    ${due.length?`<div class="list">${due.map(x=>`<div class="row" tabindex="0" data-open="tasks" data-id="${esc(x.id)}" style="padding:8px 12px"><div class="main"><span class="title" dir="auto" style="font-weight:500">${esc(x.title)}</span><span class="meta">${esc(memberName(x.ownerId))}</span></div><div class="side"><span class="${x.dueDate<td?'overdue':''}" style="font-size:13px">${fmtDate(x.dueDate)}</span></div></div>`).join('')}</div>`:`<p class="explain" style="margin:0">${t('nothingDue')}</p>`}</div>`;
  return `<section style="display:flex;flex-direction:column;gap:16px">
  ${anyExample?`<div class="toolbar" style="justify-content:space-between;background:var(--stamp-soft);padding:8px 12px;border-radius:var(--r)"><span style="font-size:14px">${t('exBanner')}</span><button class="btn small" id="clearEx">${t('removeEx')}</button></div>`:''}
  ${whole}
  <div class="section-title"><h3>${admin?t('myPerf')+' · '+esc((byId('team',sel)||mine).name):t('myPerf')}</h3>
   ${admin?`<label class="toolbar" style="font-size:14px;color:var(--muted)">${t('showFor')} <select id="meSel" style="font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink)">${data.team.map(m=>`<option value="${esc(m.id)}"${m.id===sel?' selected':''}>${esc(m.name)}</option>`).join('')}</select></label>`:''}</div>
  <div class="kpis">
     ${kpi(t('k_mySigned'),pct(p.conv,p.decided),t('k_ofDecidedShort',p.conv,p.decided))}
     ${kpi(t('k_myOpen'),p.open,t('k_claimed',money(p.openAmt)))}
     ${kpi(t('k_myWon'),pct(p.won+p.set,p.closed),t('k_outcomes',p.won,p.set,p.lost))}
     ${kpi(t('k_doneMonth'),p.doneMonth,t('k_stillOpen',p.tasksOpen))}
     ${kpi(t('k_myOverdue'),`<span${p.overdue?' class="overdue"':''}>${p.overdue}</span>`,p.overdue?t('checkTasks'):t('allOnTime'))}
  </div>
  ${dueCard}
  </section>`;
}

const view=$('#view');
view.addEventListener('input',e=>{if(e.target.id==='q'){filt.q=e.target.value;render()}});
view.addEventListener('change',async e=>{
  const id=e.target.id;
  if(id==='ownerF'){filt.owner=e.target.value;render()}
  else if(id==='tglClosed'){filt.closed=e.target.checked;render()}

/* ---------- writes ---------- */
function strip(r){const o={...r};delete o.id;return o}
async function save(col,id,body,msg){
  if(!db)return false;
  try{const ref=id?db.collection(col).doc(id):db.collection(col).doc();await ref.set(body);if(msg)toast(msg);return ref.id}
  catch(err){toast(err&&err.code==='invalid_argument'?t('errPerm'):err&&err.code==='quota_exceeded'?t('errQuota'):t('errSave'));return false}
}
async function remove(col,id){try{await db.collection(col).doc(id).delete();toast(t('deleted'));return true}catch(err){toast(t('errDel'));return false}}

/* ---------- form sheet ---------- */
function fieldHTML(f,val){
  const id='f_'+f.k,req=f.req?' required':'';
  const full=f.full||f.t==='textarea'?' full':'';
  let input;
  if(f.t==='textarea')input=`<textarea id="${id}" dir="auto">${esc(val)}</textarea>`;
  else if(f.t==='select')input=`<select id="${id}">${f.o.map(o=>`<option value="${o[0]}"${o[0]===(val||f.o[0][0])?' selected':''}>${label(f.o,o[0])}</option>`).join('')}</select>`;
  else if(f.t==='bool')input=`<select id="${id}"><option value="0"${val?'':' selected'}>${t('accMember')}</option><option value="1"${val?' selected':''}>${t('accAdmin')}</option></select>`;
  else if(f.t==='member')input=`<select id="${id}">${ownerOptions(val,t('unassigned'))}</select>`;
  else if(f.t==='client')input=`<select id="${id}"${req}><option value="">${f.req?t('chooseClient'):t('none')}</option>${data.clients.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${esc(c.id)}"${c.id===val?' selected':''}>${esc(c.name)}</option>`).join('')}</select>`;
  else if(f.t==='case')input=`<select id="${id}"><option value="">${t('none')}</option>${data.cases.map(c=>`<option value="${esc(c.id)}"${c.id===val?' selected':''}>${caseNoTxt(c.id)} ${esc(c.title)}</option>`).join('')}</select>`;
  else input=`<input id="${id}" type="${f.t||'text'}" value="${esc(val)}"${f.t==='number'?' min="0" step="1" inputmode="numeric"':''}${f.t?'':' dir="auto"'}${req}>`;
  return `<div class="fld${full}"><label for="${id}">${esc(t(f.l))}${f.req?' *':''}</label>${input}</div>`;
}

function relatedHTML(col,rec){
  if(!rec)return '';
  const mini=(c,r,txt,side)=>`<div class="row" data-open="${c}" data-id="${esc(r.id)}"><div class="main"><span class="title" style="font-weight:500">${txt}</span></div><div class="side">${side||''}</div></div>`;
  if(col==='clients'){
    const cs=data.cases.filter(c=>c.clientId===rec.id),ts=data.tasks.filter(x=>x.clientId===rec.id&&!x.done);
    return `<div class="related"><h4>${t('relCases')}</h4>${cs.length?`<div class="list">${cs.map(c=>mini('cases',c,`${caseNo(c.id)} <bdi dir="auto">${esc(c.title)}</bdi>`,`<span class="pill">${label(STAGES,c.stage)}</span>`)).join('')}</div>`:`<span class="explain" style="margin:0">${t('noCases')}</span>`}
    <div><button type="button" class="btn small" data-sub="cases">${t('newCaseFor')}</button></div>
    <h4>${t('openTasksH')}</h4>${ts.length?`<div class="list">${ts.map(x=>mini('tasks',x,`<bdi dir="auto">${esc(x.title)}</bdi>`,x.dueDate?`<span style="font-size:13px">${fmtDate(x.dueDate)}</span>`:'')).join('')}</div>`:`<span class="explain" style="margin:0">${t('noOpenTasks')}</span>`}
    <div><button type="button" class="btn small" data-sub="tasks">${t('newTaskForClient')}</button></div></div>`;
  }
  if(col==='cases'){
    const ts=data.tasks.filter(x=>x.caseId===rec.id);
    return `<div class="related"><h4>${t('tasksForCase')}</h4>${ts.length?`<div class="list">${ts.map(x=>mini('tasks',x,(x.done?'✓ ':'')+`<bdi dir="auto">${esc(x.title)}</bdi>`,x.dueDate?`<span style="font-size:13px">${fmtDate(x.dueDate)}</span>`:'')).join('')}</div>`:`<span class="explain" style="margin:0">${t('noTasks')}</span>`}
    <div><button type="button" class="btn small" data-sub="tasks">${t('newTaskForCase')}</button></div></div>`;
  }
  if(canClaim(col,rec))return `<div class="related"><h4>${t('claimTitle')}</h4><span class="explain" style="margin:0">${t('claimExplain')}</span><div><button type="button" class="btn primary small" id="claim">${t('claimBtn')}</button></div></div>`;
  if(col==='leads'&&rec.status!=='converted'&&canEdit(col,rec)){
    return `<div class="related"><h4>${t('didSign')}</h4><span class="explain" style="margin:0">${t('signExplain')}</span><div><button type="button" class="btn primary small" id="convert">${t('becameClient')}</button></div></div>`;
  }
  if(col==='leads'&&rec.clientId&&byId('clients',rec.clientId)){
    return `<div class="related"><h4>${t('nowClient')}</h4><div class="list">${mini('clients',byId('clients',rec.clientId),`<bdi dir="auto">${esc(clientName(rec.clientId))}</bdi>`)}</div></div>`;
  }
  return '';
}

function closeSheet(){$('#sheetRoot').innerHTML='';sheetState=null}

function openForm(col,rec,defaults,keepValues){
  const schema=SCHEMAS[col];
  /* when switching language with a form open, keep what the person already typed */
  let typed=null;
  if(keepValues&&sheetState){typed={};for(const f of schema){const el=$('#f_'+f.k);if(el)typed[f.k]=el.value}}
  const vals={...(rec||defaults||{}),...(typed||{})};
  if(!rec&&!typed&&col==='tasks'&&!vals.dueDate)vals.dueDate=addDays(2);
  if(!rec&&!typed&&!vals.ownerId&&col!=='team'){const d=isAdmin()?(byId('team',me)?me:myId()):myId();if(d)vals.ownerId=d}
  if(!rec&&col!=='team'&&!isAdmin())vals.ownerId=myId();
  sheetState={col,rec,defaults};
  const root=$('#sheetRoot');
  root.innerHTML=`<div class="overlay" id="ov"><form class="sheet" id="sheet" novalidate>
   <h2>${rec?t('edit_'+col):t('new_'+col)}${col==='cases'&&rec?` <span style="font-size:16px;color:var(--muted)">${caseNo(rec.id)}</span>`:''}</h2>
   <p class="hint">${t('hint_'+col)}${rec&&rec.example?' '+t('isExample'):''}${rec&&!canEdit(col,rec)&&!canClaim(col,rec)?' '+t('readOnly'):''}</p>
   <div class="fields">${schema.map(f=>fieldHTML(f,vals[f.k])).join('')}</div>
   <div class="err" id="formErr" hidden></div>
   <div class="actions">${rec&&canDelete(col,rec)?`<button type="button" class="btn danger" id="del">${t('del')}</button>`:''}<div class="end"><button type="button" class="btn" id="cancel">${t('cancel')}</button><button type="submit" class="btn primary">${rec?t('saveChanges'):t('add_'+col)}</button></div></div>
   ${relatedHTML(col,rec)}
  </form></div>`;
  const first=root.querySelector('input,select,textarea');if(first&&!rec&&!typed)first.focus();
  if(!canEdit(col,rec)){root.querySelectorAll('.fields input,.fields select,.fields textarea').forEach(el=>el.disabled=true);const sbt=root.querySelector('button[type=submit]');if(sbt)sbt.hidden=true}
  if(!isAdmin()){const o=$('#f_ownerId');if(o)o.disabled=true}
  if(col==='team'&&rec&&rec.id===myId()){const a=$('#f_isAdmin');if(a)a.disabled=true}
  $('#cancel').onclick=closeSheet;
  $('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')closeSheet()});
  root.onkeydown=e=>{if(e.key==='Escape')closeSheet()};
  $('#sheet').onsubmit=async e=>{
    e.preventDefault();
    const body=rec?strip(rec):{createdAt:new Date().toISOString()};
    for(const f of schema){let v=$('#f_'+f.k).value;if(f.t==='number')v=v===''?null:Number(v);if(f.t==='bool')v=v==='1';if(f.t==='email'&&typeof v==='string')v=v.trim().toLowerCase();body[f.k]=typeof v==='string'?v.trim():v}
    const missing=schema.filter(f=>f.req&&!body[f.k]);
    if(missing.length){const er=$('#formErr');er.textContent=t('fillIn')+missing.map(f=>t(f.l).replace(/ \(.*/,'')).join(', ');er.hidden=false;return}
    if(!isAdmin()&&col!=='team')body.ownerId=rec?rec.ownerId:myId();
    if(col==='team'&&rec&&rec.id===myId())body.isAdmin=true;
    if(col==='leads'&&!body.status)body.status='new';
    if(col==='cases'){if(!body.stage)body.stage='new';const was=rec&&CLOSED.includes(rec.stage),is=CLOSED.includes(body.stage);body.closedAt=is?(was?rec.closedAt:new Date().toISOString()):null}
    if(col==='tasks'&&!rec){body.done=false;body.doneAt=null}
    if(col==='tasks'&&body.caseId&&!body.clientId){const c=byId('cases',body.caseId);if(c)body.clientId=c.clientId}
    const ok=await save(col,rec&&rec.id,body,rec?t('saved'):t('added_'+col));
    if(ok)closeSheet();
  };
  const del=$('#del');
  if(del)del.onclick=async()=>{
    if(!del.classList.contains('armed')){del.classList.add('armed');del.textContent=t('delAgain');setTimeout(()=>{if(del.isConnected){del.classList.remove('armed');del.textContent=t('del')}},4000);return}
    if(await remove(col,rec.id))closeSheet();
  };
  root.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{
    const d=col==='clients'?{clientId:rec.id,ownerId:rec.ownerId}:{caseId:rec.id,clientId:rec.clientId,ownerId:rec.ownerId};
    openForm(b.dataset.sub,null,d)});
  root.querySelectorAll('.related [data-open]').forEach(r=>r.onclick=()=>openForm(r.dataset.open,byId(r.dataset.open,r.dataset.id)));
  const cl=$('#claim');
  if(cl)cl.onclick=async()=>{cl.disabled=true;const upd={...strip(rec),ownerId:myId()};if(await save('leads',rec.id,upd,t('claimed')))openForm('leads',{...upd,id:rec.id});else cl.disabled=false};
  const cv=$('#convert');
  if(cv)cv.onclick=async()=>{
    cv.disabled=true;
    const client={name:rec.name,phone:rec.phone||'',email:rec.email||'',ownerId:rec.ownerId||'',notes:rec.notes||'',fromLeadId:rec.id,createdAt:new Date().toISOString()};
    if(rec.example)client.example=true;
    const cid=await save('clients',null,client);
    if(!cid){cv.disabled=false;return}
    await save('leads',rec.id,{...strip(rec),status:'converted',clientId:cid});
    toast(t('converted',rec.name));
    openForm('cases',null,{clientId:cid,claimType:rec.claimType,ownerId:rec.ownerId,title:t('caseTitleDefault',label(CLAIM_TYPES,rec.claimType))});
  };
}

/* ---------- Supabase connection ----------
   The rest of the page talks to "db" with simple commands (save a record,
   delete a record, watch a list). This section translates those commands
   into Supabase calls, so nothing else in the page had to change. */
let sb=null,session=null,unsubs=[];
const loaders={};
const toSnake=k=>k.replace(/[A-Z]/g,m=>'_'+m.toLowerCase());
const toCamel=k=>k.replace(/_([a-z])/g,(m,c)=>c.toUpperCase());
function toRow(body){const o={};for(const k in body){if(k==='id')continue;let v=body[k];if(v===''||v===undefined)v=null;o[toSnake(k)]=v}return o}
function fromRow(row){const o={};for(const k in row){if(k==='id')continue;const ck=toCamel(k);let v=row[k];if(v!=null&&/At$/.test(ck)){const d=new Date(v);if(!isNaN(d))v=d.toISOString()}if(ck==='amount'&&v!=null)v=Number(v);o[ck]=v}return o}
function wrapErr(e){const perm=e&&(e.code==='42501'||/row-level security|permission|JWT/i.test(e.message||''));return {code:perm?'invalid_argument':'unavailable',message:(e&&e.message)||''}}
const newId=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
function makeDb(){
  return {collection(c){return {
    doc(id){const rid=id||newId();return {id:rid,
      async set(body){const {error}=await sb.from(c).upsert({id:rid,...toRow(body)});if(error)throw wrapErr(error);loaders[c]&&loaders[c]()},
      async delete(){const {error}=await sb.from(c).delete().eq('id',rid);if(error)throw wrapErr(error);loaders[c]&&loaders[c]()}}},
    onSnapshot(next,onErr){
      let alive=true,timer=null,seq=0;
      const load=async()=>{const my=++seq;const {data:rows,error}=await sb.from(c).select('*').limit(5000);if(!alive||my!==seq)return;
        if(error){onErr&&onErr(wrapErr(error));return}
        next({docs:rows.map(r=>({id:r.id,data:()=>fromRow(r)}))})};
      loaders[c]=load;
      const ch=sb.channel('crm-'+c+'-'+newId()).on('postgres_changes',{event:'*',schema:'public',table:c},()=>{clearTimeout(timer);timer=setTimeout(load,250)}).subscribe();
      load();
      return ()=>{alive=false;clearTimeout(timer);delete loaders[c];try{sb.removeChannel(ch)}catch(e){}};
    }}}};
}
function setSession(s){
  const had=!!session;session=s||null;
  if(session&&!had){
    db=makeDb();conn='on';
    for(const c of COLS){loaded[c]=false;
      unsubs.push(db.collection(c).onSnapshot(snap=>{data[c]=snap.docs.map(d=>({id:d.id,...d.data()}));loaded[c]=true;if(conn!=='on'){conn='on';renderSync()}render()},
        ()=>{conn='off';renderSync();render()}));
    }
  }else if(!session){
    unsubs.forEach(u=>u());unsubs=[];db=null;
    for(const c of COLS){data[c]=[];loaded[c]=false}
    conn='out';
  }
  renderSync();render();
}
view.addEventListener('submit',async e=>{
  if(e.target.id!=='loginForm')return;
  e.preventDefault();
  const email=$('#lgEmail').value.trim(),password=$('#lgPass').value,btn=$('#lgBtn'),er=$('#lgErr');
  if(!email||!password){er.textContent=t('loginFail');er.hidden=false;return}
  btn.disabled=true;btn.textContent=t('signingIn');er.hidden=true;
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error&&btn.isConnected){btn.disabled=false;btn.textContent=t('signIn');er.textContent=t('loginFail');er.hidden=false}
});

const configured=CFG.url&&CFG.key&&!/PASTE_/.test(CFG.url+CFG.key);
conn=configured?'connecting':'config';
applyLang();render();

    sb=window.supabase.createClient(CFG.url.trim(),CFG.key.trim());

  }
}
