<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a working desk. Header + tab row on top, one panel of records below; forms open as a sheet on top. Logical (start/end) properties throughout so RTL and LTR both work. */
:root{
  --bg:#eef2f3; --surface:#ffffff; --sunk:#f6f8f9; --ink:#15222a; --muted:#5a6a73; --line:#d9e1e4;
  --accent:#1d5a66; --accent-ink:#ffffff; --accent-soft:#dcebee;
  --stamp:#a9681a; --stamp-soft:#f6ead9;
  --good:#2c7a4b; --good-soft:#dff0e5; --bad:#b03a3a; --bad-soft:#f7e1e1; --neutral-soft:#e7ecee;
  --f-display:"Frank Ruhl Libre",Georgia,serif;
  --f-body:"IBM Plex Sans","IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
:root[lang="he"]{--f-body:"IBM Plex Sans Hebrew","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e161a; --surface:#152128; --sunk:#111b21; --ink:#e4ecef; --muted:#93a5ae; --line:#24343c;
  --accent:#62b2bf; --accent-ink:#06252a; --accent-soft:#1a3a41;
  --stamp:#e2a656; --stamp-soft:#3a2c17;
  --good:#6cc48f; --good-soft:#173527; --bad:#e58181; --bad-soft:#3d1e1e; --neutral-soft:#1f2d34;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e161a; --surface:#152128; --sunk:#111b21; --ink:#e4ecef; --muted:#93a5ae; --line:#24343c;
  --accent:#62b2bf; --accent-ink:#06252a; --accent-soft:#1a3a41;
  --stamp:#e2a656; --stamp-soft:#3a2c17;
  --good:#6cc48f; --good-soft:#173527; --bad:#e58181; --bad-soft:#3d1e1e; --neutral-soft:#1f2d34;
  color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:28px;margin:0;letter-spacing:.2px}
.brand .sub{font-family:var(--f-display);font-size:20px;color:var(--muted)}
.hright{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good)} .dot.off{background:var(--bad)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.lang button{font:inherit;font-size:13px;font-weight:500;border:0;background:none;color:var(--muted);padding:5px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
nav{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
nav button{font:inherit;font-weight:500;background:none;border:0;color:var(--muted);padding:8px 12px;border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);background:var(--neutral-soft);padding:0 6px;border-radius:10px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.panel-head h2{font-family:var(--f-display);font-size:24px;margin:0;font-weight:700;text-wrap:balance}
.explain{margin:4px 0 0;color:var(--muted);max-width:64ch;font-size:14px}
.btn{font:inherit;font-weight:500;font-size:14px;border-radius:var(--r);padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)} .btn.danger.armed{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input[type=search],.toolbar select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);min-width:0}
.toolbar input[type=search]{flex:1 1 200px}
.toolbar label{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row .main{min-width:0;display:flex;flex-direction:column;gap:2px}
.row .title{font-weight:600;overflow-wrap:anywhere}
.row .meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.row .side{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.task{grid-template-columns:auto minmax(0,1fr) auto}
.task input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.pill{font-size:12px;font-weight:500;padding:2px 9px;border-radius:12px;background:var(--neutral-soft);color:var(--ink);white-space:nowrap}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.stamp{background:var(--stamp-soft);color:var(--stamp)}
.ex{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--stamp);border:1px dashed var(--stamp);padding:0 6px;border-radius:4px;font-weight:500}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.overdue{color:var(--bad);font-weight:500}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);margin-bottom:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .lab{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
:root[lang="he"] .kpi .lab{font-size:13px;letter-spacing:0}
.kpi .val{font-family:var(--f-mono);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{margin:0;font-size:16px;font-weight:600}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 32px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:10px;background:var(--neutral-soft);border-radius:5px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar .num{text-align:end}
.section-title{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.section-title h3{font-family:var(--f-display);font-size:20px;margin:0}
.welcome ol{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.banner{padding:10px 14px;border-radius:var(--r);background:var(--bad-soft);color:var(--bad);font-size:14px}
.overlay{position:fixed;inset:0;background:rgba(10,20,25,.45);display:flex;justify-content:center;align-items:flex-start;padding:24px 16px;overflow-y:auto;z-index:20}
.sheet{background:var(--surface);color:var(--ink);border-radius:12px;width:100%;max-width:580px;padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.sheet h2{margin:0;font-family:var(--f-display);font-size:22px}
.sheet .hint{margin:-8px 0 0;font-size:13px;color:var(--muted)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:13px;font-weight:500;color:var(--muted)}
.fld input,.fld select,.fld textarea{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);color:var(--ink);width:100%}
.fld input[type=tel],.fld input[type=email],.fld input[type=number],.fld input[type=date]{direction:ltr;text-align:start}
:root[dir="rtl"] .fld input[type=tel],:root[dir="rtl"] .fld input[type=email],:root[dir="rtl"] .fld input[type=number],:root[dir="rtl"] .fld input[type=date]{text-align:right}
.fld textarea{min-height:80px;resize:vertical}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.actions .end{display:flex;gap:8px;margin-inline-start:auto}
.related{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.related h4{margin:0;font-size:14px}
.related .list .row{padding:8px 12px}
.err{color:var(--bad);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:560px){.fields{grid-template-columns:1fr}.bar{grid-template-columns:120px minmax(0,1fr) 28px}.brand h1{font-size:24px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .16s ease-out}@keyframes up{from{transform:translateY(8px);opacity:.6}}}
.fld input[type=password]{direction:ltr}
#who{gap:8px}
.login{max-width:420px;margin:24px auto;width:100%}
</style>

<div class="wrap">
  <header>
    <div class="brand" id="brand"></div>
    <div class="hright">
      <div class="sync"><span class="dot" id="dot"></span><span id="syncText"></span></div>
      <div class="sync" id="who"></div>
      <div class="lang" role="group" aria-label="Language / שפה">
        <button type="button" data-lang="he" lang="he">עברית</button><button type="button" data-lang="en" lang="en">English</button>
      </div>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <nav id="tabs" role="tablist"></nav>
  <main id="view"></main>
</div>
<div id="sheetRoot"></div>
<div id="toast" class="toast" hidden></div>

};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const fmtDate=s=>{if(!s)return '';const [y,m,d]=s.slice(0,10).split('-');return `<bdi class="mono" dir="ltr">${d}/${m}/${y}</bdi>`};
const money=n=>{try{return (Math.round(Number(n)||0)).toLocaleString(lang==='he'?'he-IL':'en-IL',{style:'currency',currency:'ILS',maximumFractionDigits:0})}catch(e){return '₪'+Math.round(Number(n)||0)}};
const caseNo=id=>`<bdi class="mono" dir="ltr">#${esc(String(id).slice(-5).toUpperCase())}</bdi>`;
const caseNoTxt=id=>'#'+String(id).slice(-5).toUpperCase();
const ltr=s=>`<bdi class="mono" dir="ltr">${esc(s)}</bdi>`;

let db=null,conn='connecting';
const data={team:[],leads:[],clients:[],cases:[],tasks:[]};
const loaded={};
let tab=(()=>{const h=location.hash.slice(1);return TABS.includes(h)?h:(TABS.includes(LS.get('crm.tab'))?LS.get('crm.tab'):'dash')})();
const filt={q:'',owner:'',closed:false,done:false};
let me=LS.get('crm.me')||'';
let sheetState=null;

const byId=(col,id)=>data[col].find(r=>r.id===id);
const memberName=id=>{const m=byId('team',id);return m?m.name:t('unassigned')};
const clientName=id=>{const c=byId('clients',id);return c?c.name:''};

function toast(msg){const el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2800)}

/* ---------- chrome (header, language) ---------- */
function applyLang(){
  const root=document.documentElement;root.lang=lang;root.dir=lang==='he'?'rtl':'ltr';
  $('#brand').innerHTML=lang==='he'
    ?`<h1>בדק צדק</h1><span class="sub" lang="en">CRM</span>`
    :`<h1>Bedek Tzedek CRM</h1><span class="sub" lang="he" dir="rtl">בדק צדק</span>`;
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
  renderSync();
}
function renderSync(){
  $('#dot').className='dot '+(conn==='on'?'on':['off','lost','config'].includes(conn)?'off':'');
  $('#syncText').textContent=conn==='on'?t('live'):conn==='off'?t('notConnected'):conn==='lost'?t('connLost'):conn==='config'?t('notConfigured'):conn==='out'?t('signedOut'):t('connecting');
  const b=$('#banner');
  if(conn==='off'){b.textContent=t('bannerNoDb');b.hidden=false}else if(conn==='lost'){b.textContent=t('bannerLost');b.hidden=false}else b.hidden=true;
  const who=$('#who');
  if(session&&session.user){who.innerHTML=`<bdi dir="ltr">${esc(session.user.email||'')}</bdi><button type="button" class="btn small" id="signOut">${t('signOut')}</button>`;$('#signOut').onclick=()=>{closeSheet();sb.auth.signOut()}}
  else who.innerHTML='';
}
document.querySelector('.lang').addEventListener('click',e=>{
  const b=e.target.closest('button[data-lang]');if(!b||b.dataset.lang===lang)return;
  lang=b.dataset.lang;LS.set('crm.lang',lang);applyLang();render();
  if(sheetState)openForm(sheetState.col,sheetState.rec&&byId(sheetState.col,sheetState.rec.id),sheetState.defaults,true);
});

/* ---------- tabs ---------- */
function renderTabs(){
  const counts={leads:data.leads.filter(l=>!['converted','lost'].includes(l.status)).length,clients:data.clients.length,cases:data.cases.filter(c=>!CLOSED.includes(c.stage)).length,tasks:data.tasks.filter(x=>!x.done).length,team:data.team.length};
  $('#tabs').innerHTML=TABS.map(k=>`<button role="tab" data-tab="${k}" aria-selected="${tab===k}">${t('tab_'+k)}${counts[k]!=null?` <span class="n">${counts[k]}</span>`:''}</button>`).join('');
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;tab=b.dataset.tab;LS.set('crm.tab',tab);filt.q='';filt.owner='';render()});

/* ---------- main render ---------- */
function render(){
  const v=$('#view');
  if(conn==='config'||conn==='out'||conn==='connecting'){
    $('#tabs').innerHTML='';
    v.innerHTML=conn==='config'?`<div class="card login"><h3 style="font-family:var(--f-display);font-size:22px">${t('configTitle')}</h3><p class="explain">${esc(t('configBody'))}</p></div>`
      :conn==='connecting'?`<div class="empty">${t('loading')}</div>`
      :`<div class="card login"><h3 style="font-family:var(--f-display);font-size:22px">${t('loginTitle')}</h3><p class="explain">${t('loginExplain')}</p>
        <form id="loginForm" class="fields" style="grid-template-columns:1fr" novalidate>
         <div class="fld"><label for="lgEmail">${t('f_email')}</label><input id="lgEmail" type="email" autocomplete="username" required></div>
         <div class="fld"><label for="lgPass">${t('password')}</label><input id="lgPass" type="password" autocomplete="current-password" required></div>
         <div class="err" id="lgErr" hidden></div>
         <div><button class="btn primary" type="submit" id="lgBtn">${t('signIn')}</button></div>
        </form></div>`;
    return;
  }
  renderTabs();
  const focusId=document.activeElement&&document.activeElement.id;
  v.innerHTML=tab==='dash'?renderDash():renderListTab(tab);
  if(focusId==='q'){const q=$('#q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
}

function ownerOptions(sel,blank){return `<option value="">${esc(blank)}</option>`+data.team.map(m=>`<option value="${esc(m.id)}"${m.id===sel?' selected':''}>${esc(m.name)}</option>`).join('')}

function renderListTab(col){
  const isTeam=col==='team';
  let rows=data[col].slice();
  const q=filt.q.trim().toLowerCase();
  if(q)rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q)||(r.clientId&&clientName(r.clientId).toLowerCase().includes(q)));
  if(filt.owner&&!isTeam)rows=rows.filter(r=>r.ownerId===filt.owner);
  if(col==='cases'&&!filt.closed)rows=rows.filter(r=>!CLOSED.includes(r.stage));
  if(col==='leads'&&!filt.closed)rows=rows.filter(r=>!['converted','lost'].includes(r.status));
  if(col==='tasks'&&!filt.done)rows=rows.filter(r=>!r.done);
  if(col==='tasks')rows.sort((a,b)=>(a.done-b.done)||((a.dueDate||'9999').localeCompare(b.dueDate||'9999')));
  else rows.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  const toggle=col==='cases'?`<label><input type="checkbox" id="tglClosed"${filt.closed?' checked':''}> ${t('showClosedCases')}</label>`
    :col==='leads'?`<label><input type="checkbox" id="tglClosed"${filt.closed?' checked':''}> ${esc(t('showClosedLeads'))}</label>`
    :col==='tasks'?`<label><input type="checkbox" id="tglDone"${filt.done?' checked':''}> ${t('showDone')}</label>`:'';
  const total=data[col].length;
  const body=!loaded[col]?`<div class="empty">${t('loading')}</div>`
   :rows.length?rows.map(r=>rowHTML(col,r)).join('')
   :total?`<div class="empty"><strong>${t('noMatch')}</strong>${t('tryClear')}</div>`
   :`<div class="empty"><strong>${t('empty_'+col)}</strong>${col!=='team'&&!data.team.length?t('tipTeam')+'<br>':''}${esc(t('pressNew',t('new_'+col)))}</div>`;
  return `<section style="display:flex;flex-direction:column;gap:14px">
   <div class="panel-head"><div><h2>${t('tab_'+col)}</h2><p class="explain">${esc(t('exp_'+col))}</p></div>
   <button class="btn primary" data-new="${col}"${db?'':' disabled'}>${t('new_'+col)}</button></div>
   <div class="toolbar"><input type="search" id="q" placeholder="${esc(t('search_'+col))}" value="${esc(filt.q)}" aria-label="${esc(t('search_'+col))}">
   ${isTeam?'':`<select id="ownerF" aria-label="${esc(t('everyone'))}">${ownerOptions(filt.owner,t('everyone'))}</select>`}${toggle}</div>
   <div class="list">${body}</div></section>`;
}

function rowHTML(col,r){
  const ex=r.example?` <span class="ex">${t('exampleTag')}</span>`:'';
  if(col==='team'){
    const open=data.cases.filter(c=>c.ownerId===r.id&&!CLOSED.includes(c.stage)).length;

    return `<div class="row" tabindex="0" data-open="leads" data-id="${esc(r.id)}"><div class="main"><span class="title" dir="auto">${esc(r.name)}${ex}</span><span class="meta"><span>${label(CLAIM_TYPES,r.claimType)}</span><span>${t('via',label(SOURCES,r.source))}</span><span>${esc(memberName(r.ownerId))}</span>${r.phone?ltr(r.phone):''}</span></div><div class="side"><span class="pill ${cls}">${label(LEAD_STATUS,r.status||'new')}</span></div></div>`;

  if(col==='clients'){

    const hear=r.hearingDate&&!CLOSED.includes(r.stage)?`<span>${t('hearing',fmtDate(r.hearingDate))}</span>`:'';
    return `<div class="row" tabindex="0" data-open="cases" data-id="${esc(r.id)}"><div class="main"><span class="title"><span style="color:var(--muted);font-weight:400">${caseNo(r.id)}</span> <bdi dir="auto">${esc(r.title)}</bdi>${ex}</span><span class="meta"><bdi dir="auto">${esc(clientName(r.clientId)||t('noClient'))}</bdi><span>${label(CLAIM_TYPES,r.claimType)}</span>${r.amount?`<span class="mono">${money(r.amount)}</span>`:''}${hear}<span>${esc(memberName(r.ownerId))}</span></span></div><div class="side"><span class="pill ${cls}">${label(STAGES,r.stage||'new')}</span></div></div>`;
  }
  if(col==='tasks'){
    const od=!r.done&&r.dueDate&&r.dueDate<today();
    const cs=r.caseId&&byId('cases',r.caseId);
    const link=cs?`<span>${t('caseWord')} ${caseNo(r.caseId)} <bdi dir="auto">${esc(cs.title)}</bdi></span>`:r.clientId?`<bdi dir="auto">${esc(clientName(r.clientId))}</bdi>`:'';
    return `<div class="row task${r.done?' done':''}" tabindex="0" data-open="tasks" data-id="${esc(r.id)}"><input type="checkbox" data-done="${esc(r.id)}"${r.done?' checked':''} aria-label="${t('markDone')}"><div class="main"><span class="title" dir="auto">${esc(r.title)}${ex}</span><span class="meta">${link}<span>${esc(memberName(r.ownerId))}</span></span></div><div class="side">${r.dueDate?`<span class="${od?'overdue':''}" style="font-size:13px">${od?t('overdue')+' · ':''}${fmtDate(r.dueDate)}</span>`:''}</div></div>`;
  }
}

/* ---------- dashboard ---------- */
function stats(ownerId){
  const f=r=>!ownerId||r.ownerId===ownerId;
  const leads=data.leads.filter(f),cases=data.cases.filter(f),tasks=data.tasks.filter(f);
  const now=new Date();const ms=new Date(now.getFullYear(),now.getMonth(),1).toISOString();
  const conv=leads.filter(l=>l.status==='converted').length;
  const decided=leads.filter(l=>['converted','lost'].includes(l.status)).length;
  const open=cases.filter(c=>!CLOSED.includes(c.stage));
  const won=cases.filter(c=>c.stage==='won').length,set=cases.filter(c=>c.stage==='settled').length,lost=cases.filter(c=>c.stage==='lost').length;
  const td=today();
  return {leadsMonth:leads.filter(l=>(l.createdAt||'')>=ms).length,leadsTotal:leads.length,conv,decided,
    open:open.length,openAmt:open.reduce((s,c)=>s+(Number(c.amount)||0),0),won,set,lost,closed:won+set+lost,
    tasksOpen:tasks.filter(x=>!x.done).length,overdue:tasks.filter(x=>!x.done&&x.dueDate&&x.dueDate<td).length,
    doneMonth:tasks.filter(x=>x.done&&(x.doneAt||'')>=ms).length,tasks};
}
const pct=(a,b)=>b?`<bdi dir="ltr">${Math.round(a/b*100)}%</bdi>`:'—';
const kpi=(lab,val,sub)=>`<div class="kpi"><span class="lab">${lab}</span><span class="val">${val}</span><span class="sub">${sub}</span></div>`;

/* ---------- writes ---------- */
function strip(r){const o={...r};delete o.id;return o}
async function save(col,id,body,msg){
  if(!db)return false;
  try{const ref=id?db.collection(col).doc(id):db.collection(col).doc();await ref.set(body);if(msg)toast(msg);return ref.id}
  catch(err){toast(err&&err.code==='invalid_argument'?t('errPerm'):err&&err.code==='quota_exceeded'?t('errQuota'):t('errSave'));return false}
}
async function remove(col,id){try{await db.collection(col).doc(id).delete();toast(t('deleted'));return true}catch(err){toast(t('errDel'));return false}}

/* ---------- form sheet ---------- */
function fieldHTML(f,val){
  const id='f_'+f.k,req=f.req?' required':'';
  const full=f.full||f.t==='textarea'?' full':'';
  let input;
  if(f.t==='textarea')input=`<textarea id="${id}" dir="auto">${esc(val)}</textarea>`;
  else if(f.t==='select')input=`<select id="${id}">${f.o.map(o=>`<option value="${o[0]}"${o[0]===(val||f.o[0][0])?' selected':''}>${label(f.o,o[0])}</option>`).join('')}</select>`;
  else if(f.t==='member')input=`<select id="${id}">${ownerOptions(val,t('unassigned'))}</select>`;
  else if(f.t==='client')input=`<select id="${id}"${req}><option value="">${f.req?t('chooseClient'):t('none')}</option>${data.clients.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${esc(c.id)}"${c.id===val?' selected':''}>${esc(c.name)}</option>`).join('')}</select>`;
  else if(f.t==='case')input=`<select id="${id}"><option value="">${t('none')}</option>${data.cases.map(c=>`<option value="${esc(c.id)}"${c.id===val?' selected':''}>${caseNoTxt(c.id)} ${esc(c.title)}</option>`).join('')}</select>`;
  else input=`<input id="${id}" type="${f.t||'text'}" value="${esc(val)}"${f.t==='number'?' min="0" step="1" inputmode="numeric"':''}${f.t?'':' dir="auto"'}${req}>`;
  return `<div class="fld${full}"><label for="${id}">${esc(t(f.l))}${f.req?' *':''}</label>${input}</div>`;
}

function relatedHTML(col,rec){
  if(!rec)return '';
  const mini=(c,r,txt,side)=>`<div class="row" data-open="${c}" data-id="${esc(r.id)}"><div class="main"><span class="title" style="font-weight:500">${txt}</span></div><div class="side">${side||''}</div></div>`;
  if(col==='clients'){
    const cs=data.cases.filter(c=>c.clientId===rec.id),ts=data.tasks.filter(x=>x.clientId===rec.id&&!x.done);
    return `<div class="related"><h4>${t('relCases')}</h4>${cs.length?`<div class="list">${cs.map(c=>mini('cases',c,`${caseNo(c.id)} <bdi dir="auto">${esc(c.title)}</bdi>`,`<span class="pill">${label(STAGES,c.stage)}</span>`)).join('')}</div>`:`<span class="explain" style="margin:0">${t('noCases')}</span>`}
    <div><button type="button" class="btn small" data-sub="cases">${t('newCaseFor')}</button></div>
    <h4>${t('openTasksH')}</h4>${ts.length?`<div class="list">${ts.map(x=>mini('tasks',x,`<bdi dir="auto">${esc(x.title)}</bdi>`,x.dueDate?`<span style="font-size:13px">${fmtDate(x.dueDate)}</span>`:'')).join('')}</div>`:`<span class="explain" style="margin:0">${t('noOpenTasks')}</span>`}
    <div><button type="button" class="btn small" data-sub="tasks">${t('newTaskForClient')}</button></div></div>`;
  }
  if(col==='cases'){
    const ts=data.tasks.filter(x=>x.caseId===rec.id);
    return `<div class="related"><h4>${t('tasksForCase')}</h4>${ts.length?`<div class="list">${ts.map(x=>mini('tasks',x,(x.done?'✓ ':'')+`<bdi dir="auto">${esc(x.title)}</bdi>`,x.dueDate?`<span style="font-size:13px">${fmtDate(x.dueDate)}</span>`:'')).join('')}</div>`:`<span class="explain" style="margin:0">${t('noTasks')}</span>`}
    <div><button type="button" class="btn small" data-sub="tasks">${t('newTaskForCase')}</button></div></div>`;
  }
  if(col==='leads'&&rec.status!=='converted'){
    return `<div class="related"><h4>${t('didSign')}</h4><span class="explain" style="margin:0">${t('signExplain')}</span><div><button type="button" class="btn primary small" id="convert">${t('becameClient')}</button></div></div>`;
  }
  if(col==='leads'&&rec.clientId&&byId('clients',rec.clientId)){
    return `<div class="related"><h4>${t('nowClient')}</h4><div class="list">${mini('clients',byId('clients',rec.clientId),`<bdi dir="auto">${esc(clientName(rec.clientId))}</bdi>`)}</div></div>`;
  }
  return '';
}

function closeSheet(){$('#sheetRoot').innerHTML='';sheetState=null}

function openForm(col,rec,defaults,keepValues){
  const schema=SCHEMAS[col];
  /* when switching language with a form open, keep what the person already typed */
  let typed=null;
  if(keepValues&&sheetState){typed={};for(const f of schema){const el=$('#f_'+f.k);if(el)typed[f.k]=el.value}}
  const vals={...(rec||defaults||{}),...(typed||{})};
  if(!rec&&!typed&&col==='tasks'&&!vals.dueDate)vals.dueDate=addDays(2);
  if(!rec&&!typed&&!vals.ownerId&&col!=='team'&&me&&byId('team',me))vals.ownerId=me;
  sheetState={col,rec,defaults};
  const root=$('#sheetRoot');
  root.innerHTML=`<div class="overlay" id="ov"><form class="sheet" id="sheet" novalidate>
   <h2>${rec?t('edit_'+col):t('new_'+col)}${col==='cases'&&rec?` <span style="font-size:16px;color:var(--muted)">${caseNo(rec.id)}</span>`:''}</h2>
   <p class="hint">${t('hint_'+col)}${rec&&rec.example?' '+t('isExample'):''}</p>
   <div class="fields">${schema.map(f=>fieldHTML(f,vals[f.k])).join('')}</div>
   <div class="err" id="formErr" hidden></div>
   <div class="actions">${rec?`<button type="button" class="btn danger" id="del">${t('del')}</button>`:''}<div class="end"><button type="button" class="btn" id="cancel">${t('cancel')}</button><button type="submit" class="btn primary">${rec?t('saveChanges'):t('add_'+col)}</button></div></div>
   ${relatedHTML(col,rec)}
  </form></div>`;
  const first=root.querySelector('input,select,textarea');if(first&&!rec&&!typed)first.focus();
  $('#cancel').onclick=closeSheet;
  $('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')closeSheet()});
  root.onkeydown=e=>{if(e.key==='Escape')closeSheet()};
  $('#sheet').onsubmit=async e=>{
    e.preventDefault();
    const body=rec?strip(rec):{createdAt:new Date().toISOString()};
    for(const f of schema){let v=$('#f_'+f.k).value;if(f.t==='number')v=v===''?null:Number(v);body[f.k]=typeof v==='string'?v.trim():v}
    const missing=schema.filter(f=>f.req&&!body[f.k]);
    if(missing.length){const er=$('#formErr');er.textContent=t('fillIn')+missing.map(f=>t(f.l).replace(/ \(.*/,'')).join(', ');er.hidden=false;return}
    if(col==='leads'&&!body.status)body.status='new';
    if(col==='cases'){if(!body.stage)body.stage='new';const was=rec&&CLOSED.includes(rec.stage),is=CLOSED.includes(body.stage);body.closedAt=is?(was?rec.closedAt:new Date().toISOString()):null}
    if(col==='tasks'&&!rec){body.done=false;body.doneAt=null}
    if(col==='tasks'&&body.caseId&&!body.clientId){const c=byId('cases',body.caseId);if(c)body.clientId=c.clientId}
    const ok=await save(col,rec&&rec.id,body,rec?t('saved'):t('added_'+col));
    if(ok)closeSheet();
  };
  const del=$('#del');
  if(del)del.onclick=async()=>{
    if(!del.classList.contains('armed')){del.classList.add('armed');del.textContent=t('delAgain');setTimeout(()=>{if(del.isConnected){del.classList.remove('armed');del.textContent=t('del')}},4000);return}
    if(await remove(col,rec.id))closeSheet();
  };
  root.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{
    const d=col==='clients'?{clientId:rec.id,ownerId:rec.ownerId}:{caseId:rec.id,clientId:rec.clientId,ownerId:rec.ownerId};
    openForm(b.dataset.sub,null,d)});
  root.querySelectorAll('.related [data-open]').forEach(r=>r.onclick=()=>openForm(r.dataset.open,byId(r.dataset.open,r.dataset.id)));
  const cv=$('#convert');
  if(cv)cv.onclick=async()=>{
    cv.disabled=true;
    const client={name:rec.name,phone:rec.phone||'',email:rec.email||'',ownerId:rec.ownerId||'',notes:rec.notes||'',fromLeadId:rec.id,createdAt:new Date().toISOString()};
    if(rec.example)client.example=true;
    const cid=await save('clients',null,client);
    if(!cid){cv.disabled=false;return}
    await save('leads',rec.id,{...strip(rec),status:'converted',clientId:cid});
    toast(t('converted',rec.name));
    openForm('cases',null,{clientId:cid,claimType:rec.claimType,ownerId:rec.ownerId,title:t('caseTitleDefault',label(CLAIM_TYPES,rec.claimType))});
  };
}

/* ---------- Supabase connection ----------
   The rest of the page talks to "db" with simple commands (save a record,
   delete a record, watch a list). This section translates those commands
   into Supabase calls, so nothing else in the page had to change. */
let sb=null,session=null,unsubs=[];
const loaders={};
const toSnake=k=>k.replace(/[A-Z]/g,m=>'_'+m.toLowerCase());
const toCamel=k=>k.replace(/_([a-z])/g,(m,c)=>c.toUpperCase());
function toRow(body){const o={};for(const k in body){if(k==='id')continue;let v=body[k];if(v===''||v===undefined)v=null;o[toSnake(k)]=v}return o}
function fromRow(row){const o={};for(const k in row){if(k==='id')continue;const ck=toCamel(k);let v=row[k];if(v!=null&&/At$/.test(ck)){const d=new Date(v);if(!isNaN(d))v=d.toISOString()}if(ck==='amount'&&v!=null)v=Number(v);o[ck]=v}return o}
function wrapErr(e){const perm=e&&(e.code==='42501'||/row-level security|permission|JWT/i.test(e.message||''));return {code:perm?'invalid_argument':'unavailable',message:(e&&e.message)||''}}
const newId=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
function makeDb(){
  return {collection(c){return {
    doc(id){const rid=id||newId();return {id:rid,
      async set(body){const {error}=await sb.from(c).upsert({id:rid,...toRow(body)});if(error)throw wrapErr(error);loaders[c]&&loaders[c]()},
      async delete(){const {error}=await sb.from(c).delete().eq('id',rid);if(error)throw wrapErr(error);loaders[c]&&loaders[c]()}}},
    onSnapshot(next,onErr){
      let alive=true,timer=null,seq=0;
      const load=async()=>{const my=++seq;const {data:rows,error}=await sb.from(c).select('*').limit(5000);if(!alive||my!==seq)return;
        if(error){onErr&&onErr(wrapErr(error));return}
        next({docs:rows.map(r=>({id:r.id,data:()=>fromRow(r)}))})};
      loaders[c]=load;
      const ch=sb.channel('crm-'+c+'-'+newId()).on('postgres_changes',{event:'*',schema:'public',table:c},()=>{clearTimeout(timer);timer=setTimeout(load,250)}).subscribe();
      load();
      return ()=>{alive=false;clearTimeout(timer);delete loaders[c];try{sb.removeChannel(ch)}catch(e){}};
    }}}};
}
function setSession(s){
  const had=!!session;session=s||null;
  if(session&&!had){
    db=makeDb();conn='on';
    for(const c of COLS){loaded[c]=false;
      unsubs.push(db.collection(c).onSnapshot(snap=>{data[c]=snap.docs.map(d=>({id:d.id,...d.data()}));loaded[c]=true;if(conn!=='on'){conn='on';renderSync()}render()},
        ()=>{conn='off';renderSync();render()}));
    }
  }else if(!session){
    unsubs.forEach(u=>u());unsubs=[];db=null;
    for(const c of COLS){data[c]=[];loaded[c]=false}
    conn='out';
  }
  renderSync();render();
}
view.addEventListener('submit',async e=>{
  if(e.target.id!=='loginForm')return;
  e.preventDefault();
  const email=$('#lgEmail').value.trim(),password=$('#lgPass').value,btn=$('#lgBtn'),er=$('#lgErr');
  if(!email||!password){er.textContent=t('loginFail');er.hidden=false;return}
  btn.disabled=true;btn.textContent=t('signingIn');er.hidden=true;
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error&&btn.isConnected){btn.disabled=false;btn.textContent=t('signIn');er.textContent=t('loginFail');er.hidden=false}
});

/* ---------- boot ---------- */
const CFG=window.CRM_CONFIG||{};
const configured=CFG.url&&CFG.key&&!/PASTE_/.test(CFG.url+CFG.key);
conn=configured?'connecting':'config';
applyLang();render();
if(configured){
  if(!window.supabase||!window.supabase.createClient){conn='off';renderSync();render()}
  else{
    sb=window.supabase.createClient(CFG.url.trim(),CFG.key.trim());
    sb.auth.onAuthStateChange((event,s)=>{setTimeout(()=>setSession(s),0)});
  }
}
})();
